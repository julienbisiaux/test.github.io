<h1 style="font-size:clamp(2.2rem,8vw,3.6rem)">Mes réalisations</h1>
<p>Trois cannes, trois serments faits à l'eau.</p>

<figure class="canne"><img src="images/bois.svg" alt="Canne en bois sombre au-dessus d'une eau verte au crépuscule">
<h2>La Sylve — canne en bois</h2>
<p>Taillée dans un frêne centenaire tombé un soir d'orage, la Sylve garde en elle le murmure de la forêt. Son fil de soie glisse comme une brume sur l'étang. Elle ne demande qu'une chose : que vous preniez le temps.</p></figure>

<figure class="canne"><img src="images/or.svg" alt="Canne dorée dominant une mer sombre, ombre de baleine">
<h2>L'Aurore — canne en or</h2>
<p>Forgée en or pur dix-huit carats, l'Aurore capture la première lueur du jour et la rend aux vagues. Rien ne lui résiste, pas même le colosse qui rôde sous la houle : elle est faite pour affronter les géants, avec élégance.</p></figure>

<figure class="canne"><img src="images/diamant.svg" alt="Canne de cristal étincelante, étoiles et baleine en contrebas">
<h2>L'Éternelle — canne en diamant</h2>
<p>Mille éclats, un seul geste. L'Éternelle est sertie de diamants taillés à la main, chacun gardant une étoile prisonnière. Pensée pour la pêche à la baleine, elle plie sans jamais rompre — comme les promesses qui durent.</p></figure>
